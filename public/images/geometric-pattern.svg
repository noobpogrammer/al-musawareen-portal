<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Background transparent / warm cream tint -->
  <g stroke="%23CE933E" stroke-width="1" fill="none" opacity="0.22">
    <!-- Outer square frame -->
    <rect x="0" y="0" width="120" height="120" />
    <rect x="10" y="10" width="100" height="100" />
    
    <!-- Diagonal intersecting square (45 deg rotated) -->
    <g transform="rotate(45 60 60)">
      <rect x="25" y="25" width="70" height="70" />
    </g>

    <!-- Central 8-petaled rosette flower -->
    <!-- 4 Cardinal Petals -->
    <path d="M60 20 C50 35 50 45 60 60 C70 45 70 35 60 20 Z" />
    <path d="M60 100 C50 85 50 75 60 60 C70 75 70 85 60 100 Z" />
    <path d="M20 60 C35 50 45 50 60 60 C45 70 35 70 20 60 Z" />
    <path d="M100 60 C85 50 75 50 60 60 C75 70 85 70 100 60 Z" />

    <!-- 4 Diagonal Petals -->
    <g transform="rotate(45 60 60)">
      <path d="M60 20 C50 35 50 45 60 60 C70 45 70 35 60 20 Z" />
      <path d="M60 100 C50 85 50 75 60 60 C70 75 70 85 60 100 Z" />
      <path d="M20 60 C35 50 45 50 60 60 C45 70 35 70 20 60 Z" />
      <path d="M100 60 C85 50 75 50 60 60 C75 70 85 70 100 60 Z" />
    </g>

    <!-- Corner interconnects for seamless tiling -->
    <circle cx="0" cy="0" r="8" />
    <circle cx="120" cy="0" r="8" />
    <circle cx="0" cy="120" r="8" />
    <circle cx="120" cy="120" r="8" />
    <circle cx="60" cy="60" r="5" />
  </g>
</svg>